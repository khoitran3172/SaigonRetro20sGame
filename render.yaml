services:
  - type: web
    name: saigon-retro-20s
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Chuoi ket noi Neon (postgresql://...?sslmode=require). Render se hoi khi deploy.
      - key: DATABASE_URL
        sync: false
